# Manual-only. The live site is currently served from the gh-pages branch (see README),
# because GitHub Actions cannot run while the account has a billing hold. Once that is
# cleared, run this workflow once and switch Pages back to "GitHub Actions" as the source
# to get automatic deploys on every push to main.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
